spring.application.name=DClutter
server.port=8080

# H2 Database
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.datasource.url=jdbc:h2:file:./data/declutterdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true
project.image=images/

# JWT Configuration
app.jwt.secret=dGhpcy1zZWNyZXQta2V5LWlzLXZlcnktc2hvcnQteW91LWNhbid0LWV2ZW4taW1hZ2luZS1pbXByb3ZlLXlvdXItaW1hZ2luYXRpb24=
app.jwt.expiration-ms=86400000
app.jwt.cookie-name=declutter-jwt

# Logging
logging.level.com.declutter=DEBUG
logging.level.org.hibernate.SQL=DEBUG